[workspace]
authors = ["Mathai Mathew <mathewp8616@gmail.com>"]
channels = ["robostack-jazzy", "conda-forge"]
name = "livox_gz_sim"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = 'bash -c "cd ../.. && colcon build --symlink-install --packages-select livox_gz_sim"'

[dependencies]
ros-jazzy-ros-base = ">=0.11.0,<0.12"
colcon-common-extensions = ">=0.3.0,<0.4"
compilers = ">=2.0.0,<3"
cmake = ">=4.4.4,<5"
pkg-config = ">=0.29.2,<0.30"
zlib = ">=1.3.2,<2"
ros-jazzy-livox-ros-driver2 = ">=1.2.4,<2"
ros-jazzy-gz-sim-vendor = ">=0.0.13,<0.0.14"
ros-jazzy-gz-transport-vendor = ">=0.0.9,<0.0.10"
ros-jazzy-gz-msgs-vendor = ">=0.0.8,<0.0.9"
ros-jazzy-ros-gz-sim = ">=1.0.24,<2"
ros-jazzy-ros-gz-bridge = ">=1.0.24,<2"
ros-jazzy-xacro = ">=2.1.1,<3"
ros-jazzy-robot-state-publisher = ">=3.3.4,<4"
ros-jazzy-rviz2 = ">=14.1.24,<15"
setuptools = ">=68,<70"

[activation]
scripts = ["../../install/setup.sh"]

[activation.env]
TERM = "xterm-256color"
LD_LIBRARY_PATH = "${LD_LIBRARY_PATH}:${PIXI_PROJECT_ROOT}/.pixi/envs/default/lib"
